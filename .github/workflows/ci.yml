name: CI

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ── 后端 CI ──────────────────────────────────────────────
  #
  # 为什么必须有这个 job
  #
  # 后端（server/）有独立的 package.json / tsconfig / 依赖，
  # 根目录的 `npm ci && npm run typecheck && npm run test` **完全不覆盖它**。
  # 以前后端的编译错误要等到服务器上 `docker compose up --build` 时才暴露，
  # 而 deploy.yml 的那一步是 `set -e` —— 后端编译失败会让**整个部署失败**
  # （前端也已经上传了，证书也可能正在重签）。
  #
  # 在这里提前拦掉，失败信息也更清楚。
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Build server
        working-directory: server
        run: npm run build

      # 冒烟测试：真起一个后端进程，跑一遍全部接口。
      # 覆盖「编译能过但运行时炸」的路径（SQLite 迁移、鉴权、公告 CRUD、配置读写）。
      #
      # 口令用与 smoke.mjs 相同的弱口令 —— 这里是**一次性 CI 容器**，
      # 不是生产环境，不存在泄露风险。
      #
      # 注意：不要开 `set -e`，否则冒烟失败时不会执行到 kill，后端进程会残留。
      - name: Smoke test
        working-directory: server
        env:
          PORT: '8799'
          DB_PATH: /tmp/smoke.db
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: 2018Skskwain
          SESSION_SECRET: ci-smoke-secret
        run: |
          node dist/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # 等后端起来（最多 30 秒）
          READY=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8799/health >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "后端进程提前退出"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$READY" ]; then
            echo "后端 30s 内没起来"
            exit 1
          fi

          node scripts/smoke.mjs http://127.0.0.1:8799
          STATUS=$?
          exit $STATUS
