name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # 1. 取 CI 作业已经构建好的 dist(服务器上不再跑 npm ci / vite build)
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 2. 服务器仓库同步到最新 main,并清掉上一次的 dist 残留
      #    (dist/ 在 .gitignore 里,git reset 不会动它,必须显式清理,否则旧 hash 资源会混进镜像和 SW precache)
      - name: Sync server repo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            rm -rf dist
            echo "=== repo synced to $(git rev-parse --short HEAD) ==="

      # 3. 上传 dist 到服务器项目目录(落地为 <SERVER_PROJECT_DIR>/dist)
      - name: Upload dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          source: "dist"
          target: "${{ secrets.SERVER_PROJECT_DIR }}"

      # 4. 构建镜像(只 COPY dist,秒级)并重建容器
      - name: Build image and recreate container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            test -f dist/index.html || { echo "DEPLOY FAILED: dist/index.html missing on server"; exit 1; }

            echo "=== TLS 模式 ==="
            SITE_DOMAIN_VAL=$(grep -Es '^SITE_DOMAIN=.+' .env | head -1 | cut -d= -f2- | tr -d ' \r' || true)
            ACME_EMAIL_VAL=$(grep -Es '^ACME_EMAIL=.+' .env | head -1 | cut -d= -f2- | tr -d ' \r' || true)
            if [ -n "$SITE_DOMAIN_VAL" ] && [ -z "$ACME_EMAIL_VAL" ]; then
              echo "DEPLOY FAILED: .env 里设了 SITE_DOMAIN=$SITE_DOMAIN_VAL 但没有 ACME_EMAIL,会退化成给真域名签自签证书。补上 ACME_EMAIL 后重跑。"
              exit 1
            fi
            if [ -n "$SITE_DOMAIN_VAL" ]; then
              echo "域名模式(Let's Encrypt 自动签发+续签+80→443 跳转): $SITE_DOMAIN_VAL / ACME 邮箱 $ACME_EMAIL_VAL"
              echo "前置条件:域名 A 记录已指向本机公网 IP,且安全组放行 80 和 443"
            else
              echo "自签模式: .env 里没有 SITE_DOMAIN,Caddy 使用内置 CA,浏览器会提示不安全,PWA/SW 不保证可用"
              echo "切正式证书: 在项目目录建 .env 写入 SITE_DOMAIN + ACME_EMAIL(模板见 .env.example),放行 80+443 后重跑本工作流"
            fi

            docker compose up -d --build --force-recreate
            docker image prune -f
            echo "=== Deploy done ==="
            docker compose ps
            sleep 5

            if ! docker ps --filter name=work-timer --filter status=running | grep -q work-timer; then
              echo "DEPLOY FAILED: container not running,最后 40 行日志:"
              docker compose logs --tail=40 work-timer || true
              exit 1
            fi
            echo "CONTAINER RUNNING OK"

            # 证书签发情况(域名模式下看到 certificate obtained 才算真的签下来了)
            docker compose logs --tail=60 work-timer | grep -iE "certificate|acme|error|panic" || true

            # 本机 HTTPS 自检(非致命:域名模式下用 127.0.0.1 访问不匹配站点,失败属正常)
            wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ 2>/dev/null && echo "HTTPS 本机自检通过" || echo "HTTPS 本机自检未通过(域名模式下属正常,请用真实域名验证)"
