name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # 1. 取 CI 作业已经构建好的 dist(服务器上不再跑 npm ci / vite build)
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 2. 服务器仓库同步到最新 main,并清掉上一次的 dist 残留
      #    (dist/ 在 .gitignore 里,git reset 不会动它,必须显式清理,否则旧 hash 资源会混进镜像和 SW precache)
      - name: Sync server repo
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            rm -rf dist
            echo "=== repo synced to $(git rev-parse --short HEAD) ==="

      # 2.5 准备后端环境变量
      #
      # docker-compose.yml 里 ADMIN_PASSWORD / SESSION_SECRET 用了 `:?` 语法:
      # 变量缺失时 `docker compose up` 直接报错退出。这是刻意的 ——
      # 旧版本把弱口令 `2018Skskwain` 写死在 compose 里并提交进了 git,
      # 等于把管理后台口令公开。
      #
      # 所以这里在部署前自动补齐:
      #   - SESSION_SECRET: 随机生成(不存在任何风险,自动生成即可)
      #   - ADMIN_PASSWORD: 随机生成并**打印在部署日志里**(见下方警告)
      #     首次部署后请立刻登录 /admin 改掉它
      # 已存在的值一律保留,不会覆盖(.env 不在 git 里,git reset 也不会动它)
      - name: Ensure backend env
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            ENV_FILE=".env"
            touch "$ENV_FILE"

            # SESSION_SECRET:缺失就随机生成
            if ! grep -qE '^SESSION_SECRET=.+' "$ENV_FILE"; then
              SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
              printf 'SESSION_SECRET=%s\n' "$SECRET" >> "$ENV_FILE"
              echo "已自动生成 SESSION_SECRET"
            fi

            # ADMIN_PASSWORD:缺失就随机生成一个强口令
            if ! grep -qE '^ADMIN_PASSWORD=.+' "$ENV_FILE"; then
              # 取 18 个随机字节 → base64 → 只留字母数字,截到 20 位。
              # 不用 head -c 20 截 base64(可能把 = 填充和 + / 截掉后长度不够),
              # 而是先过滤再截,保证长度稳定。
              PW=$(head -c 18 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')
              PW="${PW:0:20}"
              printf 'ADMIN_PASSWORD=%s\n' "$PW" >> "$ENV_FILE"
              echo ""
              echo "╔══════════════════════════════════════════════════════╗"
              echo "║  首次部署:已自动生成管理后台密码                          ║"
              echo "╠══════════════════════════════════════════════════════╣"
              echo "║  ADMIN_USERNAME: admin                                  ║"
              echo "║  ADMIN_PASSWORD: $PW"
              echo "╚══════════════════════════════════════════════════════╝"
              echo "请立刻登录 https://<你的域名>/admin 用这个密码登录,"
              echo "并在服务器项目目录的 .env 里改成你自己的口令。"
              echo "⚠️  这行密码会留在本次部署日志里,请尽快更换。"
              echo ""
            else
              echo "ADMIN_PASSWORD 已存在,保持不变"
              # 旧版本把弱口令写死在 compose 里,不是 .env;这里只做提示
              if grep -qE '^ADMIN_PASSWORD=2018Skskwain$' "$ENV_FILE"; then
                echo "⚠️ 警告:ADMIN_PASSWORD 仍是仓库里公开过的弱口令,建议更换"
              fi
            fi

            echo "=== .env 现有键(值已脱敏) ==="
            sed -E 's/^((ADMIN_PASSWORD|SESSION_SECRET)=).+$/\1<hidden>/' "$ENV_FILE" | grep -E '^[A-Z_]+=' || true

      # 3. 上传 dist 到服务器项目目录(落地为 <SERVER_PROJECT_DIR>/dist)
      - name: Upload dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          source: "dist"
          target: "${{ secrets.SERVER_PROJECT_DIR }}"

      # 4. 构建镜像(只 COPY dist,秒级)并重建容器
      #
      #    注意 `docker compose up -d --build` 会构建并启动**所有**服务,
      #    包括后端 api 容器(server/Dockerfile)。
      #
      #    ⚠️ 历史事故(2026-11-10 · Deploy #25):
      #    这一步曾在 26m 处超时失败,导致后端容器没起来,
      #    线上 /admin 和 /api/* 全部落回 SPA 首页。
      #    根因是 alpine(musl) 拿不到 better-sqlite3 的预编译二进制,
      #    回退 node-gyp 源码编译把构建拖到 25 分钟以上。
      #    修法:server/Dockerfile 换成 node:22-slim(glibc,直接命中官方
      #    linux-x64 预编译包)+ server/.npmrc 把二进制源指到 npmmirror。
      #    现在构建只要 1~2 分钟,这里的 30m 是**兜底**,不是预期耗时。
      - name: Build image and recreate container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            test -f dist/index.html || { echo "DEPLOY FAILED: dist/index.html missing on server"; exit 1; }

            # ── 后端镜像构建前的「源探测 + 预编译包预检」────────────
            #
            # 为什么要做这一段:
            # better-sqlite3 是原生模块,预编译二进制托管在 GitHub Releases,
            # 国内服务器拉不动就会回退 node-gyp 源码编译,把构建拖到 25 分钟
            # 冲穿 timeout(Deploy #25 就是这么挂的)。
            #
            # 现在 server/Dockerfile 换成了 node:22-slim(glibc),
            # server/.npmrc + ENV 把二进制源指到 npmmirror CDN,应该秒命中。
            # 但「国内服务器连 npmmirror 稳不稳」本身就不确定,
            # 所以这里**实测**一遍再决定用哪个源,把结论喂给 docker build。
            #
            # 三件事:
            #   1) 探测 npm 源:npmjs.org / npmmirror,谁先通用谁
            #   2) 校验 better-sqlite3 预编译包在 npmmirror CDN 上确实存在
            #   3) 两者任一不过 → **立刻失败**,把问题暴露在部署最开始,
            #      而不是等 25 分钟后拿一个 timeout 交差
            #
            # 注意 better-sqlite3 的版本要从 lock 文件里读,
            # 写死会随依赖升级悄悄失效。
            echo "=== npm 源探测 ==="
            #
            # 优先 npmmirror(国内 CDN,快),不通则退回官方 registry。
            # 两个都探测不到就直接失败 —— 那说明服务器根本没网,
            # 继续下去也只会浪费 30 分钟超时。
            #
            # ⚠️ 这里比的是**实际下载耗时**,不只是「能不能连上」。
            # 国内服务器连 npmmirror 并不总是稳的(实测时通时断),
            # 官方 registry.npmjs.org 反而经常更稳。
            # 只判「通不通」会选中一个能连但极慢的源,
            # 结果就是 npm ci 磨十几分钟 —— 那正是 Deploy #26 耗时 19 分钟的原因。
            # 所以两个源都实际拉一次同一个包,谁快用谁。
            # 版本号从 lock 文件里读,不写死(写死会随依赖升级悄悄失效)。
            # 后面的预编译包检查也复用这个值。
            BS3_VER=$(grep -A3 '"node_modules/better-sqlite3"' server/package-lock.json \
                      | grep -m1 '"version"' \
                      | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

            NPM_REGISTRY=""
            NPM_BEST_MS=999999
            for candidate in "https://registry.npmmirror.com" "https://registry.npmjs.org"; do
              # 下载 better-sqlite3 的 tarball(约 1MB),测真实速度
              MS=$(curl -sSfL --max-time 30 -o /dev/null -w '%{time_total}' \
                    "${candidate}/better-sqlite3/-/better-sqlite3-${BS3_VER}.tgz" 2>/dev/null \
                    | awk '{printf "%d", $1*1000}')
              if [ -z "$MS" ] || [ "$MS" -ge 999999 ]; then
                echo "   npm 源不可用: $candidate"
              else
                echo "   npm 源可用: $candidate (${MS}ms)"
                if [ "$MS" -lt "$NPM_BEST_MS" ]; then
                  NPM_BEST_MS=$MS
                  NPM_REGISTRY="$candidate"
                fi
              fi
            done
            if [ -z "$NPM_REGISTRY" ]; then
              echo "DEPLOY FAILED: 两个 npm 源都连不上,服务器网络异常"
              exit 1
            fi
            # 把选定的源写进 .env,供 docker-compose 的 build args 读取
            if grep -qE '^NPM_REGISTRY=' .env 2>/dev/null; then
              sed -i "s|^NPM_REGISTRY=.*|NPM_REGISTRY=${NPM_REGISTRY}|" .env
            else
              echo "NPM_REGISTRY=${NPM_REGISTRY}" >> .env
            fi
            echo "  选定源: $NPM_REGISTRY (${NPM_BEST_MS}ms)"

            echo "=== better-sqlite3 预编译包预检 ==="
            #
            # 版本与 ABI 都从仓库文件里**用 grep/awk 解析**,
            # 不依赖服务器上装了 node(宿主机不一定有,node 只在容器里)。
            #
            #   better-sqlite3 版本 ← server/package-lock.json(BS3_VER 上面已算出)
            #   Node ABI        ← server/Dockerfile 的 FROM node:XX
            #
            # 两者的对应关系是固定的(Node 的 ABI 号从 v18 起就没变过):
            #   node 18 → 108    node 20 → 115    node 22 → 127
            #   node 23 → 131    node 24 → 137
            # Dockerfile 里实际用的是动态读取(process.versions.modules),
            # 这里只是**提前**验一遍 CDN 上有没有对应的包,
            # 免得真到了 docker build 才发现拉不到。
            NODE_MAJOR=$(grep -oE '^FROM node:[0-9]+' server/Dockerfile | head -1 | grep -oE '[0-9]+')
            case "$NODE_MAJOR" in
              18) BS3_ABI=108 ;;
              20) BS3_ABI=115 ;;
              22) BS3_ABI=127 ;;
              23) BS3_ABI=131 ;;
              24) BS3_ABI=137 ;;
              *)  BS3_ABI="" ;;
            esac

            if [ -z "$BS3_VER" ] || [ -z "$BS3_ABI" ]; then
              echo "DEPLOY FAILED: 解析 better-sqlite3 版本或 Node ABI 失败 (ver=$BS3_VER major=$NODE_MAJOR)"
              echo "排查: server/package-lock.json 与 server/Dockerfile 是否被改动"
              exit 1
            fi

            # URL 规则（见 prebuild-install/util.js 的 urlTemplate）:
            #   {name}-v{version}-node-v{abi}-{platform}{libc}-{arch}.tar.gz
            #   linux + glibc → platform=linux, libc=''
            BS3_URL="https://cdn.npmmirror.com/binaries/better-sqlite3/v${BS3_VER}/better-sqlite3-v${BS3_VER}-node-v${BS3_ABI}-linux-x64.tar.gz"
            echo "预编译包: $BS3_URL"
            if curl -sSfL --max-time 30 -o /dev/null "$BS3_URL"; then
              echo "✓ better-sqlite3 v${BS3_VER} (ABI ${BS3_ABI}) 预编译包可用(无需源码编译)"
            else
              echo "DEPLOY FAILED: better-sqlite3 v${BS3_VER} 的 node-v${BS3_ABI}-linux-x64 预编译包拉不到"
              echo "排查: 1) 服务器到 cdn.npmmirror.com 的连通性 2) Node 版本是否与上面的 ABI 映射对应"
              exit 1
            fi

            # 阿里云建站产品以容器形式占着 80/443(平台内删不掉)→ 停掉并禁止自启,把端口还给我们
            # 用 docker 官方 --filter publish= 查端口归属,不解析 docker port 的文本输出
            HOLDERS=$( { docker ps -aq --filter publish=80; docker ps -aq --filter publish=443; } | sort -u )
            for cid in $HOLDERS; do
              name=$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | tr -d '/')
              if [ "$name" = "work-timer" ] || [ "$name" = "work-timer-api" ]; then continue; fi
              echo "停止占用 80/443 的容器: $name ($cid)"
              docker update --restart=no "$cid" >/dev/null 2>&1 || true
              docker stop -t 5 "$cid" || true
            done
            if ss -lntp 2>/dev/null | grep -qE ':(80|443) '; then
              echo "警告: 回收后 80/443 仍被占用,当前占用者:"
              ss -lntp | grep -E ':(80|443) ' || true
            else
              echo "80/443 已释放"
            fi
            echo "=== 回收后容器全量 ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo "=== 站点与证书 ==="
            SITE_DOMAIN_VAL=$(grep -Es '^SITE_DOMAIN=.+' .env | head -1 | cut -d= -f2- | tr -d ' \r' || true)
            DOMAIN="${SITE_DOMAIN_VAL:-persecond.work}"
            echo "站点: $DOMAIN(Let's Encrypt 自动签发+续签,验证方式 TLS-ALPN-01,容器只占 443)"
            RESOLVED=$(getent hosts "$DOMAIN" | awk '{print $1}' | head -1 || true)
            echo "DNS 解析: ${RESOLVED:-无解析记录!}"
            PUB_IP=$(curl -s --max-time 8 https://api.ipify.org || true)
            if [ -n "$RESOLVED" ] && [ -n "$PUB_IP" ] && [ "$RESOLVED" != "$PUB_IP" ]; then
              echo "警告: $DOMAIN 解析到 $RESOLVED,与本机公网 IP($PUB_IP) 不一致,证书会签失败"
            fi
            echo "前置条件: 阿里云安全组已放行 80 和 443;占用端口的建站容器已在上一步被停止"

            # ── 后端镜像先单独构建 ──────────────────────────────────
            #
            # 为什么单独构建 api 再整体 up:
            #   `docker compose up -d --build` 会**先构建所有服务**,
            #   任一构建失败就整体退出 —— 前端容器 work-timer 不会被重建,
            #   线上继续跑着**旧 Caddyfile**(没有 /admin 路由),
            #   于是 /admin 依旧打不开,而且日志里只有一个笼统的失败。
            #
            #   先单独构建 api:构建失败 → 立刻报错,前端容器保持原样(线上不受影响);
            #   构建成功 → 再整体 up,两个容器一起换新,路由立刻生效。
            #
            # 这一步顺带让「构建耗时」变得可见:
            #   构建前打印时间戳,构建后打印耗时,超时前能看出卡在哪。
            echo "=== 构建后端镜像(api) ==="
            BUILD_START=$(date +%s)
            docker compose build api
            BUILD_END=$(date +%s)
            echo "后端镜像构建耗时: $((BUILD_END - BUILD_START))s"

            echo "=== 构建前端镜像(work-timer) ==="
            # 前端镜像只 COPY dist + Caddyfile,构建是秒级的
            # (dist 由 CI 构建好 scp 上来,服务器不跑 npm/vite)
            BUILD_START=$(date +%s)
            docker compose build work-timer
            BUILD_END=$(date +%s)
            echo "前端镜像构建耗时: $((BUILD_END - BUILD_START))s"

            echo "=== 重建全部容器 ==="
            docker compose up -d --force-recreate
            docker image prune -f
            echo "=== Deploy done ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            # ── 容器健康检查 ──────────────────────────────────────
            #
            # ⚠️ 不要用 `docker ps --filter name=work-timer`:
            #    那是**子串匹配**,会同时匹配到 work-timer-api,
            #    结果就是后端挂了、前端容器也没起,这个检查照样判"通过"。
            #    这里用 docker inspect 按**精确容器名**逐个查。
            echo ""
            echo "=== 容器健康检查 ==="
            FAILED=0
            for cname in work-timer work-timer-api; do
              state=$(docker inspect -f '{{.State.Status}}' "$cname" 2>/dev/null || echo "missing")
              running=$(docker inspect -f '{{.State.Running}}' "$cname" 2>/dev/null || echo "false")
              if [ "$state" != "running" ] || [ "$running" != "true" ]; then
                echo "DEPLOY FAILED: 容器 $cname 未正常运行 (state=$state running=$running),最后 40 行日志:"
                docker logs --tail=40 "$cname" 2>&1 || true
                FAILED=1
              else
                echo "✓ 容器 $cname 运行中"
              fi
            done
            [ "$FAILED" = "0" ] || exit 1

            # 后端容器带 healthcheck,等它变 healthy(最多 90 秒)
            echo ""
            echo "=== 等待后端健康 ==="
            HEALTHY=""
            for i in $(seq 1 45); do
              h=$(docker inspect -f '{{.State.Health.Status}}' work-timer-api 2>/dev/null || echo "none")
              if [ "$h" = "healthy" ]; then HEALTHY=1; break; fi
              if [ "$h" = "unhealthy" ]; then
                echo "后端健康检查失败(unhealthy),最后 40 行日志:"
                docker logs --tail=40 work-timer-api 2>&1 || true
                exit 1
              fi
              sleep 2
            done
            if [ -z "$HEALTHY" ]; then
              echo "警告: 后端 90 秒内没变成 healthy,当前状态:"
              docker inspect -f '{{.State.Health.Status}}' work-timer-api 2>/dev/null || true
              docker logs --tail=40 work-timer-api 2>&1 || true
              exit 1
            fi
            echo "✓ 后端健康检查通过"

            # 证书签发情况(看到 certificate obtained / already have a certificate 才算签下来)
            docker compose logs --tail=80 work-timer | grep -iE "certificate|acme|alpn|error|panic" | tail -20 || true

      # 5. 从公网验证 HTTPS(证书签发通常要几十秒,重试等待)
      - name: Verify HTTPS from outside
        env:
          DOMAIN: ${{ vars.SITE_DOMAIN || 'persecond.work' }}
        run: |
          echo "从 GitHub runner 验证 https://$DOMAIN/ ..."
          ok=""
          for i in $(seq 1 15); do
            if curl -sSf -o /dev/null --max-time 10 "https://$DOMAIN/"; then ok=1; break; fi
            echo "  第 $i 次未通过,10s 后重试(Caddy 可能还在签发证书)"
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "VERIFY FAILED: https://$DOMAIN/ 从公网不可达"
            echo "按顺序排查: 1) 阿里云安全组是否放行 443  2) DNS 是否指向本机  3) 服务器上 docker compose logs --tail=80 work-timer 看 acme 报错"
            exit 1
          fi
          echo "✓ HTTPS OK"
          echo "--- 首页响应头 ---"
          curl -sSI --max-time 10 "https://$DOMAIN/" | head -10
          echo "--- sw.js 缓存头(应为 no-cache/no-store) ---"
          curl -sSI --max-time 10 "https://$DOMAIN/sw.js" | grep -i "cache-control" || true
          echo "--- http 跳转(由宿主机 OpenResty 的 301 完成) ---"
          curl -sSI --max-time 10 "http://$DOMAIN/" | head -4 || true

      # 6. 从公网验证后端可达
      #
      #    这一步是「后端真的跑起来了」的最终确认。
      #
      #    用 /api/config 而不是 /api/ping 做探针 —— /api/ping 会**真的往
      #    生产 SQLite 里写一条用户记录**,每次部署都写一条会把总用户数和
      #    日活统计污染掉(而且 ci-deploy-probe 会一直算作活跃用户)。
      #    /api/config 同样走完整链路(Caddy 反代 → api 容器 → Express → SQLite 读),
      #    但只读不写。写入路径由 CI 的冒烟测试覆盖。
      - name: Verify backend from outside
        env:
          DOMAIN: ${{ vars.SITE_DOMAIN || 'persecond.work' }}
        run: |
          echo "从 GitHub runner 验证后端 https://$DOMAIN/health ..."
          ok=""
          for i in $(seq 1 10); do
            if curl -sSf --max-time 10 "https://$DOMAIN/health" | grep -q '"ok":true'; then ok=1; break; fi
            echo "  第 $i 次未通过,5s 后重试"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "VERIFY FAILED: https://$DOMAIN/health 不可达"
            echo "排查: 服务器上 docker compose ps / docker logs --tail=50 work-timer-api"
            exit 1
          fi
          echo "✓ 后端 /health 正常"

          echo "--- /api/config 端到端(只读,不污染统计)---"
          CONFIG=$(curl -sS --max-time 10 "https://$DOMAIN/api/config" || true)
          echo "$CONFIG"
          if echo "$CONFIG" | grep -q '"ok":true'; then
            echo "✓ 后端配置接口正常(Caddy → api 容器 → SQLite 全链路通)"
          else
            echo "VERIFY FAILED: /api/config 未返回 ok:true"
            exit 1
          fi

          echo "--- 管理后台静态页 ---"
          #
          # ⚠️ 这里**不能只看 HTTP 状态码**。
          #
          # 旧 Caddyfile 只有 `try_files {path} {path}/index.html /index.html`,
          # 任何不存在的路径(包括 /admin 和 /api/*)都会被 SPA fallback
          # 重写成**首页 HTML**,并且返回 **200**。
          #
          # 所以「/admin 返回 200」在路由没配好时同样成立 ——
          # 这正是 Deploy #25 明明「验证通过」却让线上 /admin 打不开的原因。
          #
          # 正确做法:校验响应**内容**是不是管理后台页面。
          # server/public/admin/index.html 里有特征性的登录表单 id(#u / #p)。
          #
          # ⚠️ 必须用 -L 跟随重定向:
          # Express 的 express.static 对目录请求会 301 到带斜杠的路径
          # (/admin → /admin/),不跟随就只拿到 154 字节的跳转页,
          # 会被误判成「不是管理页」。
          ADMIN_HTML=$(curl -sSL --max-time 15 "https://$DOMAIN/admin" || true)
          ADMIN_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 "https://$DOMAIN/admin" || true)
          echo "/admin HTTP $ADMIN_CODE,响应长度 ${#ADMIN_HTML}"
          if [ "$ADMIN_CODE" != "200" ]; then
            echo "VERIFY FAILED: /admin 不可达 (HTTP $ADMIN_CODE)"
            exit 1
          fi
          if echo "$ADMIN_HTML" | grep -q 'id="u"'; then
            echo "✓ 管理后台可访问(返回的是管理页,不是 SPA 首页)"
          else
            echo "VERIFY FAILED: /admin 返回的不是管理后台页面"
            echo "  典型原因: Caddyfile 的 handle /admin* 路由没生效,被 SPA fallback 吞掉了"
            echo "  排查: 服务器上 docker compose logs --tail=50 work-timer 看 Caddy 路由配置"
            exit 1
          fi

          echo "--- 后端接口不被 SPA 吞掉(回归检查)---"
          # 同理,/api/* 也必须返回 JSON 而不是首页 HTML
          API_BODY=$(curl -sSL --max-time 10 "https://$DOMAIN/api/config" || true)
          if echo "$API_BODY" | grep -q '<!DOCTYPE html>'; then
            echo "VERIFY FAILED: /api/config 返回了 HTML,说明 /api 路由没生效"
            exit 1
          fi
          echo "✓ /api 路由正常(返回 JSON)"
