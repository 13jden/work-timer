<!--
  Pages Container  ·  Holds all 4 pages, only one is .is-active at a time.
-->
<div class="pages">
    <!-- ============= TODAY PAGE ============= -->
    <section class="page is-active" id="page-today" aria-label="今日">
        <div class="page-inner">
            <div class="topbar">
                <span class="eyebrow">Today · <span id="today-date-full">08.27</span></span>
                <span class="center">今日出售时间</span>
                <span class="right" id="today-date-suffix"></span>
            </div>
        </div>
    </section>

    <!-- ============= CONVERT PAGE ============= -->
    <section class="page" id="page-convert" aria-label="换算" style="pointer-events:none;">
        <div class="page-inner">
            <div class="page-head">
                <div class="eyebrow">What does it cost</div>
                <h2>等价换算</h2>
            </div>
            <div class="convert-list" id="convert-list"></div>
            <button class="add-item-btn" id="add-item-btn">
                <span style="font-size:18px;line-height:1;">＋</span>
                <span>添加喜欢的东西</span>
            </button>
        </div>
    </section>

    <!-- ============= CALENDAR PAGE ============= -->
    <section class="page" id="page-calendar" aria-label="日历" style="pointer-events:none;">
        <div class="page-inner">
            <div class="calendar-head">
                <div class="month" id="cal-month">八月</div>
                <div class="year" id="cal-year">2026</div>
            </div>
            <div class="cal-summary">
                <div class="card green">
                    <div class="num" id="cal-workdays">0</div>
                    <div class="lbl">工作日</div>
                </div>
                <div class="card white">
                    <div class="num" id="cal-daily-avg">¥0</div>
                    <div class="lbl">日均</div>
                </div>
                <div class="card white">
                    <div class="num" id="cal-month-earned">¥0</div>
                    <div class="lbl">已赚</div>
                </div>
            </div>
            <div class="cal-month-nav">
                <button id="cal-prev" aria-label="上个月">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <path d="M9 2L4 7L9 12"/>
                    </svg>
                </button>
                <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;">Tap any day</span>
                <button id="cal-next" aria-label="下个月">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <path d="M5 2L10 7L5 12"/>
                    </svg>
                </button>
            </div>
            <div class="cal-grid">
                <div class="cal-weekdays">
                    <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
                </div>
                <div class="cal-days" id="cal-days"></div>
            </div>
        </div>
    </section>

    <!-- ============= SETTINGS PAGE ============= -->
    <section class="page" id="page-settings" aria-label="设置" style="pointer-events:none;">
        <div class="page-inner">
            <div class="page-head">
                <div class="eyebrow">Preferences</div>
                <h2>设置</h2>
            </div>

            <div class="settings-group">
                <div class="eyebrow">薪资 · Salary</div>
                <div class="settings-card">
                    <div class="settings-row">
                        <span class="label">月薪</span>
                        <span class="value">
                            <span class="prefix">¥</span>
                            <input type="number" inputmode="decimal" id="set-monthly-salary" placeholder="15000" value="15000" min="1">
                        </span>
                    </div>
                    <div class="settings-row">
                        <span class="label">当月工作日</span>
                        <span class="value">
                            <span id="set-current-workdays">—</span>
                            <span class="suffix">天</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="settings-group">
                <div class="eyebrow">时间 · Hours</div>
                <div class="settings-card">
                    <div class="settings-row">
                        <span class="label">上班时间</span>
                        <span class="value"><input type="time" id="set-start-time" value="09:00"></span>
                    </div>
                    <div class="settings-row">
                        <span class="label">下班时间</span>
                        <span class="value"><input type="time" id="set-end-time" value="18:00"></span>
                    </div>
                    <div class="settings-row">
                        <span class="label">午休时长</span>
                        <span class="value">
                            <input type="number" inputmode="decimal" id="set-lunch-break" placeholder="1" value="1" min="0" max="4" step="0.5">
                            <span class="suffix">小时</span>
                        </span>
                    </div>
                    <div class="settings-row">
                        <span class="label">休息模式</span>
                        <span class="value">
                            <select id="set-rest-mode" style="border:none;background:transparent;font-family:var(--font-mono);font-size:15px;color:var(--muted);font-weight:600;outline:none;padding:2px 0;">
                                <option value="2">双休</option>
                                <option value="1">单休</option>
                                <option value="0">无休</option>
                            </select>
                            <span class="chevron">›</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="settings-group">
                <div class="eyebrow">月度薪资 · Monthly</div>
                <div class="settings-card">
                    <div class="settings-row" id="row-monthly-summary">
                        <span class="label">本月记录</span>
                        <span class="value" style="font-size:13px;" id="set-monthly-summary">—</span>
                    </div>
                </div>
            </div>

            <div class="settings-group">
                <div class="eyebrow">主题 · Theme</div>
                <div class="settings-card">
                    <div class="settings-row" id="theme-picker">
                        <span class="label">配色方案</span>
                        <span class="value" style="gap:10px;">
                            <button class="theme-swatch" data-theme="paper"    title="柠檬黄"  style="width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:#C8FF00;transition:transform .15s;"></button>
                            <button class="theme-swatch" data-theme="obsidian" title="靛蓝"    style="width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:#7C6FF7;transition:transform .15s;"></button>
                            <button class="theme-swatch" data-theme="gold"     title="香槟金"  style="width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:#C9A84C;transition:transform .15s;"></button>
                        </span>
                    </div>
                </div>
            </div>

            <div class="settings-group">
                <div class="eyebrow">换算 · Convert</div>
                <div class="settings-card">
                    <div class="settings-row">
                        <span class="label">咖啡默认单价</span>
                        <span class="value">
                            <span class="prefix">¥</span>
                            <input type="number" inputmode="decimal" id="set-coffee-price" placeholder="15" value="15" min="0.01">
                        </span>
                    </div>
                    <div class="settings-row" id="goto-quotes">
                        <span class="label">每日批注</span>
                        <span class="value">
                            <span>自动轮换</span>
                            <span class="chevron">›</span>
                        </span>
                    </div>
                </div>
            </div>

            <button class="save-btn" id="save-btn">保存配置</button>

            <div class="settings-group" style="margin-top:18px;">
                <div class="eyebrow">月度记录 · Salary History</div>
                <div class="settings-card" id="monthly-history-list"></div>
            </div>
            <div class="settings-footer">v1.1 · 本地存储</div>
        </div>
    </section>
</div>
