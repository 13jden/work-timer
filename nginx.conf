# ⚠️ 已停用:生产镜像改用 Caddy(见 Caddyfile / Dockerfile),本文件不再被引用。
#    保留原因:如果哪天要退回 nginx,下面的 SPA fallback、缓存策略、
#    以及 /sw.js 不缓存的处理可以直接搬回去(等价规则已写在 Caddyfile 里)。
#    注意:退回 nginx 就要自己解决证书签发与续签(certbot + webroot + 定时器)。

server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # PWA:Service Worker 必须每次回源校验,否则新版本永远发不到客户端
    # (精确匹配优先级高于下面的 \.js$ 正则,不会被 1y immutable 覆盖)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # PWA:manifest 同样不做强缓存
    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
    
    # 静态资源缓存(文件名带 hash,可以长期 immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 禁用缓存 HTML（确保更新及时）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
